name: Emulator native build
on:
  push:
    branches: [Emulator]
    paths: ['ios/**', '.github/workflows/emulator-e1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emulator-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Native core integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare repository-local temporary storage
        run: mkdir -p work/e1/tmp
      - name: Build the pinned core without JIT or desktop dependencies
        env:
          CHROMIUM_PATH: google-chrome
        run: |
          export TMPDIR="$PWD/work/e1/tmp"
          cmake -S ios -B work/e1/build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build work/e1/build-linux --parallel 4
          ctest --test-dir work/e1/build-linux --output-on-failure
  ios:
    name: iOS release builds
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check durable storage on macOS
        timeout-minutes: 3
        run: |
          mkdir -p work/e1/tmp
          export TMPDIR="$PWD/work/e1/tmp"
          xcrun --sdk iphoneos clang++ -std=c++17 -fobjc-arc -fsyntax-only -target arm64-apple-ios17.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -Iios/Core '-DREADER_BUILD_VERSION="0.4.0"' '-DREADER_CORE_REVISION="b86390e4428bf38ce4c1ce0e9ca446d6d25955e8"' ios/App/EmulatorController.mm ios/App/ReaderWebController.mm
          xcrun --sdk macosx clang++ -std=c++17 -O2 -fobjc-arc -Iios/Core ios/Core/ReaderServer.cpp ios/Tests/WebKitSmoke.mm -framework AppKit -framework WebKit -o work/e1/webkit-smoke
          python3 ios/scripts/bundle-reader.py work/e1/Reader
          node ios/scripts/reader-fixtures.cjs work/e1
          cp work/e1/reader-soulsilver-after.sav work/e1/reader-soulsilver-completed.sav
          cp work/e1/reader-platinum-after.sav work/e1/reader-platinum-completed.sav
          work/e1/webkit-smoke work/e1/Reader work/e1
          c++ -std=c++17 -O2 -Wall -Wextra -Iios/Core ios/Core/Library.cpp ios/Core/Checkpoint.cpp ios/Tests/LibraryTests.cpp -o work/e1/storage-tests -lz
          c++ -std=c++17 -O2 -Wall -Wextra -Iios/Core ios/Core/Library.cpp ios/Core/Checkpoint.cpp ios/Tests/CheckpointTests.cpp -o work/e1/checkpoint-tests -lz
          cd work/e1
          ./storage-tests ../../tests/fixtures/gen4/platinum/early.sav
          ./checkpoint-tests
      - name: Compile and package iPhone release
        run: python3 ios/scripts/build.py --sdk iphoneos
      - name: Compile and package simulator release
        run: python3 ios/scripts/build.py --sdk iphonesimulator
      - name: Upload unsigned binaries and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: ReaderEmulator-E4-unsigned
          path: work/e1/artifacts/
          if-no-files-found: error
          retention-days: 30
